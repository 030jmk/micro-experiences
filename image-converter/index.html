<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="convert image files to different format.">
  <title>Image Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body { background: #f8f9fa; }
    .drop {
      border: 2px dashed #ced4da; border-radius: .75rem; background: #fff;
      padding: 3rem 1rem; text-align: center; cursor: pointer; transition: .15s;
    }
    .drop:hover, .drop.over { border-color: #0d6efd; background: #f1f6ff; }
    .thumb {
      width: 48px; height: 48px; object-fit: contain; border-radius: .375rem; flex-shrink: 0;
      background: conic-gradient(#e9ecef 25%, #fff 0 50%, #e9ecef 0 75%, #fff 0) 0 0 / 12px 12px;
    }
    .name { min-width: 0; }
    .name div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
<main class="container py-5" style="max-width: 760px;">
  <h1 class="h4 mb-1">Image Converter</h1>
  <p class="text-secondary small mb-4">SVG &amp; WebP → PNG / JPG / WebP. Runs entirely in your browser — files never leave your device.</p>

  <!-- Drop zone -->
  <label id="drop" class="drop d-block mb-3">
    <input id="fileInput" type="file" multiple hidden
           accept=".svg,.webp,.png,.jpg,.jpeg,.gif,.avif,image/svg+xml,image/webp,image/png,image/jpeg,image/gif,image/avif">
    <div class="fw-semibold">Drop files here</div>
    <div class="text-secondary small">or click to browse</div>
  </label>

  <!-- Options -->
  <div class="row g-2 mb-2">
    <div class="col-6 col-md-3">
      <label class="form-label small text-secondary mb-1" for="format">Format</label>
      <select id="format" class="form-select">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp" id="webpOpt">WebP</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label small text-secondary mb-1" for="size">Size</label>
      <select id="size" class="form-select">
        <option value="orig">Original</option>
        <option value="512">512 × 512</option>
        <option value="1000" selected>1000 × 1000</option>
        <option value="2048">2048 × 2048</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label small text-secondary mb-1" for="fit">Fit</label>
      <select id="fit" class="form-select">
        <option value="contain">Contain</option>
        <option value="cover">Cover (crop)</option>
        <option value="stretch">Stretch</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label small text-secondary mb-1" for="bg">Background</label>
      <div class="input-group">
        <input type="color" id="bg" class="form-control form-control-color" value="#ffffff" title="Background color">
        <span class="input-group-text small">
          <input class="form-check-input mt-0 me-1" type="checkbox" id="transparent" checked>
          <label for="transparent" class="small mb-0">None</label>
        </span>
      </div>
    </div>
  </div>

  <div id="customRow" class="row g-2 mb-2 d-none">
    <div class="col-6 col-md-3">
      <input id="cw" type="number" min="1" max="8192" class="form-control" placeholder="Width (auto)">
    </div>
    <div class="col-6 col-md-3">
      <input id="ch" type="number" min="1" max="8192" class="form-control" placeholder="Height (auto)">
    </div>
  </div>

  <!-- Actions -->
  <div class="d-flex gap-2 align-items-center my-3">
    <button id="convertBtn" class="btn btn-primary" disabled>
      <span id="spin" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
      <span id="convertTxt">Convert</span>
    </button>
    <button id="zipBtn" class="btn btn-outline-primary d-none">Download all</button>
    <button id="clearBtn" class="btn btn-link text-secondary ms-auto d-none">Clear</button>
  </div>

  <!-- File list -->
  <ul id="list" class="list-group"></ul>
</main>

<script>
(() => {
  const MAX = 8192;
  const QUALITY = 0.92;
  const EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };
  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileInput = $('fileInput'), list = $('list');
  const formatEl = $('format'), sizeEl = $('size'), fitEl = $('fit');
  const bgEl = $('bg'), transEl = $('transparent'), cwEl = $('cw'), chEl = $('ch');
  const convertBtn = $('convertBtn'), spin = $('spin'), convertTxt = $('convertTxt');
  const zipBtn = $('zipBtn'), clearBtn = $('clearBtn');

  let items = [];
  let busy = false;
  let nextId = 1;

  /* ---------- WebP encode support check ---------- */
  // Browsers that can't encode WebP silently return PNG instead.
  (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    if (!c.toDataURL('image/webp').startsWith('data:image/webp')) {
      const opt = $('webpOpt');
      opt.disabled = true;
      opt.textContent = 'WebP (not supported in this browser)';
    }
  })();

  /* ---------- helpers ---------- */
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
  const isSvg = f => f.type === 'image/svg+xml' || /\.svg$/i.test(f.name);
  const isImage = f => isSvg(f) || f.type.startsWith('image/');
  const tick = () => new Promise(r => setTimeout(r, 0));

  function loadImage(url) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Could not read image'));
      img.src = url;
    });
  }

  /* ---------- sources ---------- */
  async function prepSvg(file) {
    let text = await file.text();
    if (!/<svg[^>]*\sxmlns=["']http:\/\/www\.w3\.org\/2000\/svg["']/i.test(text)) {
      text = text.replace(/<svg\b/i, '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const svg = doc.documentElement;
    if (doc.querySelector('parsererror') || svg.nodeName.toLowerCase() !== 'svg') throw new Error('Invalid SVG');

    const num = a => { const v = svg.getAttribute(a); return v && !v.includes('%') ? parseFloat(v) : NaN; };
    let w = num('width'), h = num('height');
    let vbw, vbh;
    const vb = svg.getAttribute('viewBox');
    if (vb) { const p = vb.trim().split(/[\s,]+/).map(Number); vbw = p[2]; vbh = p[3]; }

    if (!(w > 0) || !(h > 0)) {
      if (vbw > 0 && vbh > 0) {
        if (w > 0) h = w * vbh / vbw;
        else if (h > 0) w = h * vbw / vbh;
        else { w = vbw; h = vbh; }
      } else { w = w > 0 ? w : 300; h = h > 0 ? h : 150; }
    }
    if (!vb) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

    return {
      w, h,
      // Re-render the vector at the exact target size so it stays crisp
      async draw(ctx, dx, dy, dw, dh, stretch) {
        svg.setAttribute('width', dw);
        svg.setAttribute('height', dh);
        if (stretch) svg.setAttribute('preserveAspectRatio', 'none');
        const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        try { ctx.drawImage(await loadImage(url), dx, dy, dw, dh); }
        finally { URL.revokeObjectURL(url); }
      }
    };
  }

  async function prepRaster(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      return {
        w: img.naturalWidth, h: img.naturalHeight,
        async draw(ctx, dx, dy, dw, dh) { ctx.drawImage(img, dx, dy, dw, dh); },
        dispose() { URL.revokeObjectURL(url); }
      };
    } catch (e) { URL.revokeObjectURL(url); throw e; }
  }

  /* ---------- conversion ---------- */
  function readOpts() {
    return {
      format: formatEl.value,
      size: sizeEl.value,
      fit: fitEl.value,
      bg: bgEl.value,
      // PNG and WebP support transparency; JPG does not
      transparent: formatEl.value !== 'image/jpeg' && transEl.checked,
      cw: parseInt(cwEl.value, 10) || 0,
      ch: parseInt(chEl.value, 10) || 0
    };
  }

  function targetSize(w, h, o) {
    if (o.size === 'orig') return [Math.round(w), Math.round(h)];
    if (o.size !== 'custom') { const n = +o.size; return [n, n]; }
    if (o.cw && o.ch) return [o.cw, o.ch];
    if (o.cw) return [o.cw, Math.round(o.cw * h / w)];
    if (o.ch) return [Math.round(o.ch * w / h), o.ch];
    return [Math.round(w), Math.round(h)];
  }

  async function convert(file, o) {
    const src = isSvg(file) ? await prepSvg(file) : await prepRaster(file);
    try {
      const [W, H] = targetSize(src.w, src.h, o);
      if (W < 1 || H < 1) throw new Error('Invalid size');
      if (W > MAX || H > MAX) throw new Error(`Max ${MAX}px per side`);

      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      if (!o.transparent) { ctx.fillStyle = o.bg; ctx.fillRect(0, 0, W, H); }

      let dx = 0, dy = 0, dw = W, dh = H;
      const stretch = o.fit === 'stretch';
      if (!stretch) {
        const s = o.fit === 'cover' ? Math.max(W / src.w, H / src.h) : Math.min(W / src.w, H / src.h);
        dw = src.w * s; dh = src.h * s;
        dx = (W - dw) / 2; dy = (H - dh) / 2;
      }
      await src.draw(ctx, dx, dy, dw, dh, stretch);

      const blob = await new Promise((res, rej) =>
        c.toBlob(b => b ? res(b) : rej(new Error('Encoding failed')), o.format, QUALITY));
      if (blob.type !== o.format) throw new Error(`${EXT[o.format].toUpperCase()} not supported in this browser`);
      return { blob, w: W, h: H };
    } finally {
      src.dispose && src.dispose();
    }
  }

  function outName(file, format, used) {
    const base = file.name.replace(/\.[^.]+$/, '') || 'image';
    const ext = EXT[format];
    let name = `${base}.${ext}`, i = 2;
    while (used.has(name)) name = `${base}-${i++}.${ext}`;
    used.add(name);
    return name;
  }

  async function convertAll() {
    if (busy || !items.length) return;
    busy = true;
    const o = readOpts();
    const used = new Set();
    const total = items.filter(i => i.status !== 'invalid').length;
    let n = 0;
    items.forEach(it => { if (it.status !== 'invalid') it.status = 'queued'; });
    render();

    for (const it of items) {
      if (it.status === 'invalid') continue;
      n++;
      convertTxt.textContent = `Converting ${n}/${total}`;
      it.status = 'working';
      render();
      await tick();
      try {
        const r = await convert(it.file, o);
        if (it.url) URL.revokeObjectURL(it.url);
        Object.assign(it, { blob: r.blob, url: URL.createObjectURL(r.blob), w: r.w, h: r.h,
                            out: outName(it.file, o.format, used), status: 'done', err: '' });
      } catch (e) {
        it.status = 'error'; it.err = e.message || 'Failed';
      }
      render();
    }
    busy = false;
    render();
  }

  /* ---------- files ---------- */
  function addFiles(files) {
    for (const f of files) {
      items.push({
        id: nextId++, file: f,
        preview: URL.createObjectURL(f),
        status: isImage(f) ? 'queued' : 'invalid',
        err: isImage(f) ? '' : 'Unsupported file'
      });
    }
    render();
  }

  function removeItem(id) {
    const i = items.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = items[i];
    URL.revokeObjectURL(it.preview);
    if (it.url) URL.revokeObjectURL(it.url);
    items.splice(i, 1);
    render();
  }

  function download(url, name) {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  async function downloadAll() {
    const done = items.filter(i => i.status === 'done');
    if (!done.length) return;
    if (window.JSZip) {
      zipBtn.disabled = true;
      const txt = zipBtn.textContent;
      zipBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Zipping';
      const zip = new JSZip();
      done.forEach(i => zip.file(i.out, i.blob));
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      download(url, 'converted-images.zip');
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      zipBtn.textContent = txt; zipBtn.disabled = false;
    } else {
      for (const i of done) { download(i.url, i.out); await new Promise(r => setTimeout(r, 300)); }
    }
  }

  /* ---------- render ---------- */
  function render() {
    list.innerHTML = items.map(it => {
      let meta, right;
      const inType = isSvg(it.file) ? 'SVG' : (it.file.type.split('/')[1] || 'file').toUpperCase();
      switch (it.status) {
        case 'working':
          meta = `${inType} · converting…`;
          right = '<div class="spinner-border spinner-border-sm text-primary" role="status"></div>';
          break;
        case 'done':
          meta = `${it.w} × ${it.h} · ${fmtBytes(it.blob.size)}`;
          right = `<button class="btn btn-sm btn-primary" data-dl="${it.id}">Download</button>`;
          break;
        case 'error':
        case 'invalid':
          meta = `<span class="text-danger">${esc(it.err)}</span>`;
          right = '';
          break;
        default:
          meta = `${inType} · ${fmtBytes(it.file.size)}`;
          right = '';
      }
      const rm = it.status === 'working' || busy ? '' :
        `<button class="btn-close ms-2" aria-label="Remove" data-rm="${it.id}"></button>`;
      const src = it.status === 'done' ? it.url : it.preview;
      return `<li class="list-group-item d-flex align-items-center gap-3">
        <img class="thumb" src="${src}" alt="">
        <div class="name flex-grow-1">
          <div class="small fw-semibold">${esc(it.status === 'done' ? it.out : it.file.name)}</div>
          <div class="small text-secondary">${meta}</div>
        </div>
        ${right}${rm}
      </li>`;
    }).join('');

    const valid = items.filter(i => i.status !== 'invalid').length;
    const doneCount = items.filter(i => i.status === 'done').length;
    convertBtn.disabled = busy || !valid;
    spin.classList.toggle('d-none', !busy);
    if (!busy) convertTxt.textContent = doneCount ? 'Convert again' : 'Convert';
    zipBtn.classList.toggle('d-none', busy || doneCount < 2);
    clearBtn.classList.toggle('d-none', busy || !items.length);
  }

  function syncOptions() {
    const jpg = formatEl.value === 'image/jpeg';
    transEl.disabled = jpg;
    bgEl.disabled = !jpg && transEl.checked;
    $('customRow').classList.toggle('d-none', sizeEl.value !== 'custom');
  }

  /* ---------- events ---------- */
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => {
    ev.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => {
    ev.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', ev => addFiles(ev.dataTransfer.files));
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

  list.addEventListener('click', ev => {
    const dl = ev.target.closest('[data-dl]');
    const rm = ev.target.closest('[data-rm]');
    if (dl) { const it = items.find(i => i.id === +dl.dataset.dl); it && download(it.url, it.out); }
    if (rm) removeItem(+rm.dataset.rm);
  });

  convertBtn.addEventListener('click', convertAll);
  zipBtn.addEventListener('click', downloadAll);
  clearBtn.addEventListener('click', () => { [...items].forEach(i => removeItem(i.id)); });
  [formatEl, sizeEl, transEl].forEach(el => el.addEventListener('change', syncOptions));

  syncOptions();
  render();
})();
</script>
</body>
</html>
